              private LinearLayout.LayoutParams rowLp() {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, (int) (48 * dens), 1f);
                  lp.setMargins((int) (3 * dens), (int) (3 * dens), (int) (3 * dens), (int) (3 * dens));
                  return lp;
