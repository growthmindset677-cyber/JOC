name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/ordercopy
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OrderCopy"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
          android {
              namespace 'com.example.ordercopy'
              compileSdk 34
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'hud'
                      keyPassword System.getenv('KS_PASS')
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }
              defaultConfig {
                  applicationId 'com.hood.cardjoc'
                  minSdk 24
                  targetSdk 34
                  versionCode runNo
                  versionName '3.1'
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.documentfile:documentfile:1.0.1'
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="مُرتب كارت جوك"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".TableActivity"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:type="radial"
                  android:centerX="0.5"
                  android:centerY="0.52"
                  android:gradientRadius="62%p"
                  android:startColor="#338320"
                  android:endColor="#01230B" />
          </shape>
          EOF

