                  c.addView(w, new LinearLayout.LayoutParams(-1, -2));
                  return c;
              }

              private void openTable() {
                  if (last == null) return;
                  act.startActivity(new Intent(act, TableActivity.class));
              }

              // ---------------------------------------------------------------- الحساب

              void onPicked(final Uri uri) {
                  if (busy) return;
                  busy = true;
                  btnPick.setEnabled(false);
                  btnTable.setEnabled(false);
                  totals.setVisibility(View.GONE);
                  tvWarn.setVisibility(View.GONE);
                  tvDetailTitle.setVisibility(View.GONE);
                  detailsList.removeAllViews();
                  prog.setVisibility(View.VISIBLE);
                  tvStatus.setText("جاري قراءة الملفات...");
                  new Thread(() -> compute(uri)).start();
              }

              private static boolean isAudio(MainActivity.Item it) {
                  String n = it.name.toLowerCase(Locale.US);
                  int dot = n.lastIndexOf('.');
                  if (dot < 0) return false;
                  String ext = n.substring(dot + 1);
                  for (String e : EXTS) {
                      if (e.equals(ext)) return true;
                  }
                  return false;
              }

              private void addFile(FolderRec s, MainActivity.Item it, int[] counter, List<FileRec> recs, List<Uri> uris) {
                  FileRec r = new FileRec();
                  r.name = it.name;
                  counter[0]++;
                  r.number = counter[0];
                  s.files.add(r);
                  recs.add(r);
                  uris.add(it.file.getUri());
              }

              // يمشي بنفس ترتيب الراديو: ملفات المجلد أولاً ثم مجلداته الفرعية، ولكل مجلد صف على أي عمق
              private void walk(DocumentFile dir, String name, int depth, List<FolderRec> rows, int[] counter,
                                List<FileRec> recs, List<Uri> uris, int[] serial) {
                  FolderRec fr = new FolderRec();
                  fr.name = name;
                  fr.depth = depth;
                  if (depth == 0) fr.serial = ++serial[0];
                  int at = rows.size();
                  rows.add(fr);
                  MainActivity.Ordered o = act.order(dir);
                  for (MainActivity.Item it : o.items) {
                      if (it.dir) {
                          walk(it.file, it.name, depth + 1, rows, counter, recs, uris, serial);
                      } else if (isAudio(it)) {
                          addFile(fr, it, counter, recs, uris);
                      }
                  }
                  if (fr.files.isEmpty() && rows.size() == at + 1) {
                      rows.remove(at);
                      if (depth == 0) serial[0]--;
                  }
              }

              private long durationMs(Uri uri) {
                  MediaMetadataRetriever r = new MediaMetadataRetriever();
                  try {
                      r.setDataSource(act, uri);
                      String v = r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION);
                      if (v == null) return -1L;
                      return Long.parseLong(v);
                  } catch (Exception e) {
                      return -1L;
                  } finally {
                      try {
                          r.release();
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void compute(Uri uri) {
                  try {
                      DocumentFile root = DocumentFile.fromTreeUri(act, uri);
                      final String rootName = (root != null && root.getName() != null) ? root.getName() : "";
                      ui.post(() -> tvName.setText("المختار: " + rootName));

                      final CardData cd = new CardData();
                      cd.rootName = rootName;
                      final List<FileRec> recs = new ArrayList<>();
                      final List<Uri> uris = new ArrayList<>();
                      int[] counter = new int[]{0};

                      MainActivity.Ordered top = act.order(root);
                      int[] serial = new int[]{0};
                      FolderRec loose = null;
                      for (MainActivity.Item it : top.items) {
                          if (!it.dir) {
                              if (!isAudio(it)) continue;
                              if (loose == null) {
                                  loose = new FolderRec();
                                  loose.name = "ملفات خارج المجلدات";
                                  loose.depth = 0;
                                  loose.serial = ++serial[0];
                                  cd.rows.add(loose);
                              }
                              addFile(loose, it, counter, recs, uris);
                          } else {
                              walk(it.file, it.name, 0, cd.rows, counter, recs, uris, serial);
                          }
                      }

                      final int n = recs.size();
                      final AtomicInteger done = new AtomicInteger(0);
                      ExecutorService pool = Executors.newFixedThreadPool(4);
                      for (int i = 0; i < n; i++) {
                          final int idx = i;
                          pool.execute(() -> {
                              recs.get(idx).ms = durationMs(uris.get(idx));
                              final int dn = done.incrementAndGet();
                              if (dn % 10 == 0 || dn == n) {
                                  ui.post(() -> tvStatus.setText(MainActivity.ar(dn + " / " + n)));
                              }
                          });
                      }
                      pool.shutdown();
                      pool.awaitTermination(3, TimeUnit.HOURS);

                      long total = 0;
                      int bad = 0;
                      int nfiles = 0;
                      for (FolderRec fr : cd.rows) {
                          fr.start = fr.files.isEmpty() ? 0 : fr.files.get(0).number;
                          for (FileRec f : fr.files) {
                              nfiles++;
                              if (f.ms >= 0) {
                                  fr.totalMs += f.ms;
                              } else {
                                  fr.bad++;
                                  bad++;
                              }
                          }
                          total += fr.totalMs;
                      }
                      cd.totalMs = total;
                      cd.files = nfiles;
                      cd.bad = bad;
                      last = cd;
                      ui.post(() -> show(cd));
                  } catch (Exception e) {
                      final String msg = String.valueOf(e.getMessage());
                      ui.post(() -> {
                          busy = false;
                          prog.setVisibility(View.GONE);
                          btnPick.setEnabled(true);
                          tvStatus.setText("خطأ: " + msg);
                      });
                  }
              }

              // ---------------------------------------------------------------- العرض

              private static String two(long v) {
                  return String.format(Locale.US, "%02d", v);
              }

              private TextView timeBox(long ms, int sp) {
                  return act.text(MainActivity.ar(timeWords(ms)), sp, GOLD, true);
              }

              private void show(CardData cd) {
                  busy = false;
                  prog.setVisibility(View.GONE);
                  btnPick.setEnabled(true);
                  tvStatus.setText("");
                  if (cd.files == 0) {
                      tvStatus.setText("مفيش ملفات صوتية في المجلد ده");
                      return;
                  }
                  long mins = minutesOf(cd.totalMs);
                  numH.setText(MainActivity.ar(String.valueOf(mins / 60)));
                  numM.setText(MainActivity.ar(two(mins % 60)));
                  tvCount.setText(MainActivity.ar(String.valueOf(cd.files)) + " ملف");
                  totals.setVisibility(View.VISIBLE);
                  if (cd.bad > 0) {
                      tvWarn.setText(MainActivity.ar(String.valueOf(cd.bad)) + " ملفات لم تُحسب");
                      tvWarn.setVisibility(View.VISIBLE);
                  }

                  detailsList.removeAllViews();
                  for (FolderRec fr : cd.rows) {
                      LinearLayout row = new LinearLayout(act);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setPadding(0, (int) (10 * d), 0, (int) (10 * d));

                      if (fr.depth > 0) {
                          StringBuilder arrows = new StringBuilder();
                          for (int k = 0; k < fr.depth; k++) arrows.append('\u2039');
                          TextView at = act.text(arrows.toString(), 15, GOLD, true);
                          at.setTextDirection(View.TEXT_DIRECTION_LTR);
                          at.setPaddingRelative(0, 0, (int) (6 * d), 0);
                          row.addView(at, new LinearLayout.LayoutParams(-2, -2));
                      }

                      SpannableStringBuilder sb = new SpannableStringBuilder();
                      sb.append(fr.name);
                      sb.setSpan(new StyleSpan(fr.depth == 0 ? Typeface.BOLD : Typeface.ITALIC), 0, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      if (!fr.files.isEmpty()) {
                          sb.append("  (" + MainActivity.ar(String.valueOf(fr.files.size())) + ")");
                      }
                      TextView nm = act.text("", 15, CREAM, false);
                      nm.setText(sb);
                      row.addView(nm, new LinearLayout.LayoutParams(0, -2, 1f));
                      if (!fr.files.isEmpty()) {
                          row.addView(timeBox(fr.totalMs, 15), new LinearLayout.LayoutParams(-2, -2));
                      }
                      detailsList.addView(row, new LinearLayout.LayoutParams(-1, -2));

                      View line = new View(act);
                      line.setBackgroundColor(LINEC);
                      detailsList.addView(line, new LinearLayout.LayoutParams(-1, 1));
                  }
                  tvDetailTitle.setVisibility(View.VISIBLE);
                  btnTable.setEnabled(true);
              }
          }
