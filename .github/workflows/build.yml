              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) return;
                  if (req == 2) {
                      tool.onPicked(data.getData());
                      return;
                  }
                  rootUri = data.getData();
                  DocumentFile f = DocumentFile.fromTreeUri(this, rootUri);
                  String name = (f != null && f.getName() != null) ? f.getName() : rootUri.toString();
                  tvRoot.setText("المختار: " + name);
                  btnStart.setEnabled(false);
              }

              static boolean skip(String n) {
                  String l = n.toLowerCase();
                  return n.startsWith(".") || n.equals(TMP) || l.equals("android")
                          || l.equals("lost.dir") || l.equals("system volume information")
                          || l.equals("$recycle.bin");
              }

              // الملفات أولاً ثم المجلدات، وكل مجموعة تُرتَّب بحسب محتواها
              Ordered order(DocumentFile dir) {
                  List<Item> files = new ArrayList<>();
                  List<Item> dirs = new ArrayList<>();
                  for (DocumentFile f : dir.listFiles()) {
                      String n = f.getName();
                      if (n == null || skip(n)) continue;
                      Item it = new Item();
                      it.name = n;
                      it.file = f;
                      it.dir = f.isDirectory();
                      if (it.dir) dirs.add(it);
                      else files.add(it);
                  }
                  Sorter.Result rf = Sorter.sort(files);
                  Sorter.Result rd = Sorter.sort(dirs);
                  Ordered o = new Ordered();
                  o.items.addAll(rf.items);
                  o.items.addAll(rd.items);
                  o.mode = files.isEmpty() ? rd.mode : rf.mode;
                  return o;
              }

              private void scanDir(DocumentFile dir) {
                  Ordered o = order(dir);
                  if (o.items.size() >= 2) modeCount[o.mode]++;
                  for (Item it : o.items) {
                      if (it.dir) {
                          dirsTotal++;
                          scanDir(it.file);
                      } else {
                          filesTotal++;
                      }
                  }
              }

              private String modesLine() {
                  return "طرق الترتيب: مصحف " + modeCount[Sorter.MODE_QURAN]
                          + " | أرقام " + modeCount[Sorter.MODE_NUMBERS]
                          + " | أبجدي " + modeCount[Sorter.MODE_ALPHA];
              }

              private void scan() {
                  if (rootUri == null) {
                      Toast.makeText(this, "اختر الكارت أو المجلد أولاً", Toast.LENGTH_LONG).show();
                      return;
                  }
                  tvLog.setText("");
                  tvStatus.setText("جارٍ الفحص...");
                  new Thread(() -> {
                      try {
                          DocumentFile r = DocumentFile.fromTreeUri(this, rootUri);
                          dirsTotal = 1;
                          filesTotal = 0;
                          modeCount[0] = 0;
                          modeCount[1] = 0;
                          modeCount[2] = 0;
                          scanDir(r);
                          Ordered top = order(r);
                          StringBuilder sb = new StringBuilder("طريقة الترتيب في هذا المجلد: ");
                          sb.append(Sorter.modeName(top.mode)).append("\nالترتيب الذي سيُطبَّق:\n");
                          int n = Math.min(top.items.size(), 40);
                          for (int i = 0; i < n; i++) {
                              sb.append(i + 1).append(". ");
                              if (top.items.get(i).dir) sb.append("[مجلد] ");
                              sb.append(top.items.get(i).name).append("\n");
                          }
                          if (top.items.size() > n) sb.append("... و").append(top.items.size() - n).append(" أخرى\n");
                          final String preview = sb.toString();
                          final String st = "مجلدات: " + dirsTotal + " | ملفات: " + filesTotal + "\n" + modesLine();
                          ui.post(() -> {
                              tvStatus.setText(st);
                              tvLog.setText(preview);
                              btnStart.setEnabled(true);
                          });
                      } catch (Exception e) {
                          ui.post(() -> tvStatus.setText("خطأ: " + e.getMessage()));
                      }
                  }).start();
              }

              private void confirmStart() {
                  new AlertDialog.Builder(this)
                          .setTitle("تأكيد البدء")
                          .setMessage("سيُنقل محتوى كل مجلد مؤقتاً داخل الكارت ثم يُعاد بالترتيب الجديد. لا تسحب الكارت ولا تُغلق التطبيق حتى تظهر كلمة «اكتمل».")
                          .setPositiveButton("ابدأ", (dlg, w) -> start())
                          .setNegativeButton("إلغاء", null)
                          .show();
              }

              private int cNonMp3, cHigh, cUnreadable, cMp3;
              private final List<String> cLines = new ArrayList<>();

              private void addCompatLine(String s) {
                  synchronized (cLines) {
                      cLines.add(s);
                  }
              }

              private void compatWalk(DocumentFile dir, String path, MediaMetadataRetriever mmr) {
                  for (DocumentFile f : dir.listFiles()) {
                      if (cancelled) return;
                      String n = f.getName();
                      if (n == null || skip(n)) continue;
                      if (f.isDirectory()) {
                          compatWalk(f, path + n + "/", mmr);
                          continue;
                      }
                      if (!n.toLowerCase().endsWith(".mp3")) {
                          cNonMp3++;
                          addCompatLine("[ليس MP3] " + path + n);
                          continue;
                      }
                      cMp3++;
                      try {
                          mmr.setDataSource(this, f.getUri());
                          String br = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_BITRATE);
                          if (br == null) {
                              cUnreadable++;
                              addCompatLine("[تعذّرت قراءة الجودة] " + path + n);
                          } else {
                              long bps = Long.parseLong(br);
                              if (bps > 130000L) {
                                  cHigh++;
                                  addCompatLine("[" + (bps / 1000) + "kbps] " + path + n);
                              }
                          }
                      } catch (Exception e) {
                          cUnreadable++;
                          addCompatLine("[تعذّرت قراءة الجودة] " + path + n);
                      }
                      if (cMp3 % 20 == 0) {
                          final int c = cMp3;
                          ui.post(() -> tvStatus.setText("جارٍ فحص التوافق... فُحص " + c + " ملف MP3"));
                      }
                  }
              }

              private void compat() {
                  if (rootUri == null) {
                      Toast.makeText(this, "اختر الكارت أو المجلد أولاً", Toast.LENGTH_LONG).show();
                      return;
                  }
                  cancelled = false;
                  tvLog.setText("");
                  tvStatus.setText("جارٍ فحص التوافق...");
                  new Thread(() -> {
                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                      try {
                          cNonMp3 = 0;
                          cHigh = 0;
                          cUnreadable = 0;
                          cMp3 = 0;
                          synchronized (cLines) {
                              cLines.clear();
                          }
                          compatWalk(DocumentFile.fromTreeUri(this, rootUri), "/", mmr);
                          int ok = cMp3 - cHigh - cUnreadable;
                          StringBuilder sb = new StringBuilder();
                          synchronized (cLines) {
                              int shown = Math.min(cLines.size(), 80);
                              for (int i = 0; i < shown; i++) sb.append(cLines.get(i)).append("\n");
                              if (cLines.size() > shown) sb.append("... و").append(cLines.size() - shown).append(" أخرى\n");
                          }
                          String head = cancelled ? "تم الإيقاف — " : "";
                          final String st = head + "فحص التوافق: صالحة " + ok + " | ليست MP3: " + cNonMp3
                                  + " | فوق 128kbps: " + cHigh + " | تعذّرت القراءة: " + cUnreadable;
                          final String detail = (sb.length() == 0)
                                  ? "لا توجد ملفات يتجاهلها الراديو.\n"
                                  : "الملفات التالية يتجاهلها الراديو أو يحتمل ذلك، ولم يتغيّر فيها شيء:\n" + sb;
                          ui.post(() -> {
                              tvStatus.setText(st);
                              tvLog.setText(detail);
                          });
                      } catch (Exception e) {
                          ui.post(() -> tvStatus.setText("خطأ: " + e.getMessage()));
                      } finally {
                          try { mmr.release(); } catch (Exception ignored) { }
                      }
                  }).start();
              }

              private void start() {
                  cancelled = false;
                  btnStart.setEnabled(false);
                  tvLog.setText("");
                  dirsDone = 0;
                  failures = 0;
                  dirsOrdered = 0;
                  modeCount[0] = 0;
                  modeCount[1] = 0;
                  modeCount[2] = 0;
                  ui.post(() -> {
                      bar.setMax(Math.max(dirsTotal, 1));
                      bar.setProgress(0);
                  });
                  new Thread(() -> {
                      try {
                          DocumentFile r = DocumentFile.fromTreeUri(this, rootUri);
                          processDir(r, "/");
                          final String end = cancelled ? "تم الإيقاف" : "اكتمل";
                          final String msg = end + " — مجلدات: " + dirsDone + " | مرتبة حسب ما يعرضه النظام: "
                                  + dirsOrdered + " | أخطاء: " + failures + "\n" + modesLine();
                          ui.post(() -> tvStatus.setText(msg));
                      } catch (Exception e) {
                          ui.post(() -> tvStatus.setText("خطأ: " + e.getMessage()));
                      } finally {
                          ui.post(() -> btnStart.setEnabled(true));
                      }
                  }).start();
              }

              private Uri treeUri(Uri moved, String fallbackId) {
                  String id = (moved != null) ? DocumentsContract.getDocumentId(moved) : fallbackId;
                  return DocumentsContract.buildDocumentUriUsingTree(rootUri, id);
              }

              // إن بقيت ملفات في المجلد المؤقت من تشغيل سابق متوقف، تُعاد أولاً
              private void restoreTemp(DocumentFile dir, DocumentFile temp) {
                  List<Item> kids = new ArrayList<>();
                  for (DocumentFile f : temp.listFiles()) {
                      String n = f.getName();
                      if (n == null) continue;
                      Item it = new Item();
                      it.name = n;
                      it.file = f;
                      it.dir = f.isDirectory();
                      kids.add(it);
                  }
                  for (Item it : Sorter.sort(kids).items) {
                      try {
                          DocumentsContract.moveDocument(getContentResolver(), it.file.getUri(), temp.getUri(), dir.getUri());
                      } catch (Exception e) {
                          failures++;
                          log("تعذّرت إعادة " + it.name + " — " + e.getMessage());
                      }
                  }
                  if (temp.listFiles().length == 0) temp.delete();
              }

              private void processDir(DocumentFile dir, String path) {
                  if (cancelled) return;

                  DocumentFile old = dir.findFile(TMP);
                  if (old != null && old.isDirectory()) restoreTemp(dir, old);

                  Ordered ord = order(dir);
                  List<Item> items = ord.items;

                  for (Item it : items) {
                      if (it.dir) {
                          processDir(it.file, path + it.name + "/");
                          if (cancelled) return;
                      }
                  }

                  dirsDone++;
                  final int d = dirsDone;
                  final String p = path;
                  ui.post(() -> {
                      bar.setProgress(d);
                      tvStatus.setText("المجلد " + d + " من " + dirsTotal + " — " + p);
                  });

                  if (items.size() < 2) {
                      dirsOrdered++;
                      return;
                  }
                  modeCount[ord.mode]++;

                  DocumentFile temp = dir.createDirectory(TMP);
                  if (temp == null) {
                      failures++;
                      log("تعذّر إنشاء مجلد مؤقت في " + path);
                      return;
                  }
                  Uri dirUri = dir.getUri();
                  Uri tmpUri = temp.getUri();
                  String tmpId = DocumentsContract.getDocumentId(tmpUri);

                  List<Uri> moved = new ArrayList<>();
                  for (Item it : items) {
                      if (cancelled) break;
                      try {
                          Uri nu = DocumentsContract.moveDocument(getContentResolver(), it.file.getUri(), dirUri, tmpUri);
                          moved.add(treeUri(nu, tmpId + "/" + it.name));
                      } catch (Exception e) {
                          failures++;
                          log("تعذّر نقل " + it.name + " في " + path + " — " + e.getMessage());
                          break;
                      }
                  }

                  for (Uri u : moved) {
                      try {
                          DocumentsContract.moveDocument(getContentResolver(), u, tmpUri, dirUri);
                      } catch (Exception e) {
                          failures++;
                          log("تعذّرت الإعادة في " + path + " — " + e.getMessage() + " (أعد التشغيل لإكمالها)");
                      }
                  }

                  if (temp.listFiles().length == 0) {
                      temp.delete();
                  } else {
                      log("بقيت ملفات في " + TMP + " داخل " + path + " — أعد التشغيل لإكمالها");
                  }

                  List<String> expected = new ArrayList<>();
                  for (Item it : items) expected.add(it.name);
                  List<String> actual = new ArrayList<>();
                  for (DocumentFile f : dir.listFiles()) {
                      String n = f.getName();
                      if (n == null || skip(n)) continue;
                      actual.add(n);
                  }
                  if (expected.equals(actual)) {
                      dirsOrdered++;
                  } else {
                      log("الترتيب الظاهر مختلف في " + path);
                  }
              }

              private void log(String s) {
                  ui.post(() -> tvLog.append(s + "\n"));
              }
          }
