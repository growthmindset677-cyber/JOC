                  sl.addState(new int[]{-android.R.attr.state_enabled}, shape(0xFF3A5A4C, 0));
                  sl.addState(new int[]{}, primary ? shape(GOLD, 0) : shape(0xFF174C3A, GOLD));
                  bt.setBackground(sl);
                  bt.setTextColor(new ColorStateList(
                          new int[][]{new int[]{-android.R.attr.state_enabled}, new int[]{}},
                          new int[]{0xFF8AA79B, primary ? 0xFF1B2A22 : GOLD}));
                  return bt;
              }

              private void reload() {
                  String html = TableBuilder.build(DurationTool.last, details, cols, landscape);
                  web.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
              }

              private void printTable() {
                  PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                  PrintDocumentAdapter adapter = web.createPrintDocumentAdapter("card_table");
                  PrintAttributes.MediaSize size = landscape
                          ? PrintAttributes.MediaSize.ISO_A4.asLandscape()
                          : PrintAttributes.MediaSize.ISO_A4;
                  PrintAttributes attrs = new PrintAttributes.Builder().setMediaSize(size).build();
                  pm.print("جدول الكارت", adapter, attrs);
              }
          }
