          package com.example.ordercopy;

          import java.util.Locale;

          public class TableBuilder {

              static String esc(String s) {
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;");
              }

              // يحذف الامتداد والترقيم في أول الاسم: 001-الفاتحة.mp3 -> الفاتحة
              static String clean(String name) {
                  String n = name;
                  int dot = n.lastIndexOf('.');
                  if (dot > 0 && n.length() - dot <= 6) n = n.substring(0, dot);
                  int i = 0;
                  while (i < n.length() && (Character.isDigit(n.charAt(i)) || " -_.)(".indexOf(n.charAt(i)) >= 0)) i++;
                  String rest = n.substring(i).trim();
                  return rest.isEmpty() ? n : rest;
              }

              // الوقت بالكلمات (ساعة ودقيقة) بلا ثوانٍ
              static String hm(long ms) {
                  if (ms < 0) return "—";
                  return esc(DurationTool.timeWords(ms));
              }

              // عدد الأسهم يساوي عدد المجلدات التي فوق هذا المجلد
              static String arrows(int depth) {
                  if (depth <= 0) return "";
                  StringBuilder s = new StringBuilder("<span class='ar'>");
                  for (int i = 0; i < depth; i++) s.append("&#8249;");
                  s.append("</span>");
                  return s.toString();
              }

              static String build(DurationTool.CardData cd, boolean details, int cols, boolean landscape) {
                  int width = landscape ? 1040 : 730;
                  StringBuilder h = new StringBuilder();
                  h.append("<!DOCTYPE html><html dir='rtl' lang='ar'><head><meta charset='utf-8'>");
                  h.append("<meta name='viewport' content='width=").append(width + 30).append("'>");
                  h.append("<style>");
                  h.append("body{font-family:sans-serif;margin:0;padding:8px 10px;color:#111;background:#fff;width:").append(width).append("px}");
                  h.append("h1{font-size:18px;text-align:center;margin:4px 0 10px}");
                  h.append("table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:").append(details ? 11 : 14).append("px}");
                  h.append("th,td{border:1px solid #444;padding:4px 3px;text-align:center;word-wrap:break-word}th{overflow-wrap:normal;word-break:keep-all}");
                  h.append("th{background:#0F3D2E;color:#F5E6A8;font-weight:bold;-webkit-print-color-adjust:exact}");
                  h.append("thead{display:table-header-group}tr{page-break-inside:avoid}");
                  h.append("tr.blk td{border-top:2px solid #000}");
                  h.append("tr.fb td{border-top:1.5px solid #666}");
                  h.append("td.tot{background:#EFEBDD;font-weight:bold;-webkit-print-color-adjust:exact}");
                  h.append("td.nm{text-align:start}td.main{font-weight:bold}td.sub{font-style:italic}td[rowspan]{vertical-align:top}");
                  h.append(".ar{direction:ltr;unicode-bidi:isolate;font-weight:bold;font-style:normal;color:#8A6D12;margin-left:5px;-webkit-print-color-adjust:exact}");
                  h.append("");
                  h.append(".note{font-size:11px;color:#555;margin-top:6px}");
                  h.append("</style></head><body>");
                  h.append("<h1>جدول محتويات الكارت");
                  if (cd.rootName != null && cd.rootName.length() > 0) h.append(" — ").append(esc(cd.rootName));
                  h.append("</h1>");

                  if (!details) {
                      buildSimple(h, cd);
                  } else {
                      buildDetails(h, cd, cols);
                  }
                  if (cd.bad > 0) {
                      h.append("<div class='note'>— ملف لم تُحسب مدته ولم يدخل في الإجمالي</div>");
                  }
                  h.append("</body></html>");
                  return h.toString();
              }

              private static void buildSimple(StringBuilder h, DurationTool.CardData cd) {
                  h.append("<table><colgroup><col style='width:7%'><col style='width:37%'><col style='width:12%'>");
                  h.append("<col style='width:14%'><col style='width:30%'></colgroup>");
                  h.append("<thead><tr><th>المسلسل</th><th>المجلد</th><th>عدد الملفات</th>");
                  h.append("<th>تبدأ من الرقم</th><th>الوقت</th></tr></thead><tbody>");
                  for (DurationTool.FolderRec fr : cd.rows) {
                      boolean main = fr.depth == 0;
                      h.append("<tr").append(main ? " class='blk'" : "").append(">");
                      h.append("<td>").append(main ? String.valueOf(fr.serial) : "").append("</td>");
                      h.append("<td class='nm ").append(main ? "main" : "sub").append("'>");
                      h.append(arrows(fr.depth)).append(esc(fr.name)).append("</td>");
                      if (fr.files.isEmpty()) {
                          h.append("<td></td><td></td><td></td>");
                      } else {
                          h.append("<td>").append(fr.files.size()).append("</td>");
                          h.append("<td>").append(fr.start).append("</td>");
                          h.append("<td>").append(hm(fr.totalMs)).append("</td>");
                      }
                      h.append("</tr>");
                  }
                  h.append("</tbody></table>");
              }

              private static void buildDetails(StringBuilder h, DurationTool.CardData cd, int cols) {
                  double rest = 64.0 / cols;
                  h.append("<table><colgroup><col style='width:4%'><col style='width:20%'>");
                  h.append("<col style='width:6%'><col style='width:6%'>");
                  for (int c = 0; c < cols; c++) {
                      h.append("<col style='width:").append(String.format(Locale.US, "%.2f", rest * 0.38)).append("%'>");
                      h.append("<col style='width:").append(String.format(Locale.US, "%.2f", rest * 0.26)).append("%'>");
                      h.append("<col style='width:").append(String.format(Locale.US, "%.2f", rest * 0.36)).append("%'>");
                  }
                  h.append("</colgroup><thead><tr>");
                  h.append("<th rowspan='2'>م</th><th rowspan='2'>المجلد</th>");
                  h.append("<th rowspan='2'>عدد الملفات</th><th rowspan='2'>تبدأ من</th>");
                  h.append("<th colspan='").append(3 * cols).append("'>تفاصيل الملفات</th></tr><tr>");
                  for (int c = 0; c < cols; c++) {
                      h.append("<th>اسم الملف</th><th>رقم التشغيل</th><th>الوقت</th>");
                  }
                  h.append("</tr></thead><tbody>");

                  for (DurationTool.FolderRec fr : cd.rows) {
                      boolean main = fr.depth == 0;
                      int cnt = fr.files.size();
                      int rowsN = (int) Math.ceil(cnt / (double) cols);
                      int span = Math.max(1, rowsN);
                      for (int r = 0; r < span; r++) {
                          h.append("<tr");
                          if (r == 0) h.append(" class='").append(main ? "blk" : "fb").append("'");
                          h.append(">");
                          if (r == 0) {
                              h.append("<td rowspan='").append(span).append("'>").append(main ? String.valueOf(fr.serial) : "").append("</td>");
                              h.append("<td rowspan='").append(span).append("' class='nm ").append(main ? "main" : "sub").append("'>");
                              h.append(arrows(fr.depth)).append(esc(fr.name)).append("</td>");
                              h.append("<td rowspan='").append(span).append("'>").append(cnt > 0 ? String.valueOf(cnt) : "").append("</td>");
                              h.append("<td rowspan='").append(span).append("'>").append(cnt > 0 ? String.valueOf(fr.start) : "").append("</td>");
                          }
                          for (int c = 0; c < cols; c++) {
                              int idx = c * rowsN + r;
                              if (idx < cnt) {
                                  DurationTool.FileRec f = fr.files.get(idx);
                                  h.append("<td>").append(esc(clean(f.name))).append("</td>");
                                  h.append("<td>").append(f.number).append("</td>");
                                  h.append("<td>").append(hm(f.ms)).append("</td>");
                              } else {
                                  h.append("<td></td><td></td><td></td>");
                              }
                          }
                          h.append("</tr>");
                      }
                  }
                  h.append("</tbody></table>");
              }
          }
