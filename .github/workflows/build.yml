              static String ar(String s) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if (c >= '0' && c <= '9') sb.append((char) ('\u0660' + (c - '0')));
                      else sb.append(c);
