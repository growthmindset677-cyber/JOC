              static class Alias {
                  int surah;
                  String[] toks;
                  boolean shortAlias;
              }

              static final List<Alias> ALIASES = new ArrayList<>();

              static {
                  for (int i = 0; i < SURAHS.length; i++) {
                      for (String a : SURAHS[i]) {
                          List<String> t = prep(norm(a));
                          Alias al = new Alias();
                          al.surah = i + 1;
                          al.toks = t.toArray(new String[0]);
                          al.shortAlias = al.toks.length == 1 && al.toks[0].length() <= 2;
                          ALIASES.add(al);
                      }
                  }
              }

              static boolean otherTokensIgnorable(List<String> toks, int skipIndex) {
                  for (int j = 0; j < toks.size(); j++) {
                      if (j == skipIndex) continue;
                      String t = toks.get(j);
                      if (!isDigits(t) && !t.equals("سوره")) return false;
                  }
                  return true;
              }

              static int quranIndex(List<String> toks) {
                  int bestPos = Integer.MAX_VALUE;
                  int best = -1;
                  int bestLen = 0;
                  for (Alias a : ALIASES) {
                      int len = a.toks.length;
                      for (int i = 0; i + len <= toks.size(); i++) {
                          boolean ok = true;
                          for (int j = 0; j < len; j++) {
                              if (!toks.get(i + j).equals(a.toks[j])) {
                                  ok = false;
                                  break;
                              }
                          }
                          if (!ok) continue;
                          if (a.shortAlias) {
                              boolean afterSurah = i > 0 && toks.get(i - 1).equals("سوره");
                              if (!afterSurah && !otherTokensIgnorable(toks, i)) continue;
                          }
                          if (i < bestPos || (i == bestPos && len > bestLen)) {
                              bestPos = i;
                              best = a.surah;
                              bestLen = len;
                          }
                          break;
                      }
                  }
                  return best;
              }

              // ================= الترتيب =================

              public static Result sort(List<MainActivity.Item> group) {
                  Result res = new Result();
                  List<Info> infos = new ArrayList<>();
                  for (MainActivity.Item it : group) {
                      Info f = new Info();
                      f.item = it;
                      String base = it.dir ? it.name : stripExt(it.name);
                      f.toks = prep(stripTech(norm(base)));
                      f.key = join(f.toks, 0, f.toks.size());
                      f.quran = quranIndex(f.toks);
                      f.dlist = digitNumbers(f.toks);
                      f.word = wordNumber(f.toks);
                      infos.add(f);
                  }

                  int n = infos.size();
                  Set<Integer> distinct = new HashSet<>();
                  int wordCount = 0;
                  int withDigits = 0;
                  Set<String> seen = new HashSet<>();
                  for (Info f : infos) {
                      if (f.quran > 0) distinct.add(f.quran);
                      if (f.word > 0) wordCount++;
                      if (!f.dlist.isEmpty()) {
                          withDigits++;
                          seen.add(f.dlist.toString());
                      }
                  }
                  final boolean quranMode = n >= 2 && distinct.size() * 10 >= n * 6;
                  boolean useWords = wordCount >= 2;
                  // الأرقام المتطابقة في كل الملفات (سنة أو وسم) لا تصلح للترتيب، فيُنتقل إلى الأعداد المكتوبة بالحروف
                  boolean digitsUsable = seen.size() >= 2 || (withDigits >= 1 && !useWords);

                  boolean anyNumber = false;
                  for (Info f : infos) {
                      f.seq = null;
                      if (digitsUsable && !f.dlist.isEmpty()) {
                          f.seq = new long[f.dlist.size()];
                          for (int i2 = 0; i2 < f.seq.length; i2++) f.seq[i2] = f.dlist.get(i2);
                      } else if (useWords && f.word > 0) {
                          f.seq = new long[]{f.word};
                      } else if (useWords && !f.dlist.isEmpty()) {
                          // اسم فيه رقم عادي وسط أسماء أرقامها بالحروف: يُعدّ من السلسلة نفسها
                          f.seq = new long[f.dlist.size()];
                          for (int i3 = 0; i3 < f.seq.length; i3++) f.seq[i3] = f.dlist.get(i3);
                      }
                      if (f.seq != null) {
                          f.num = f.seq[0];
                          anyNumber = true;
                      } else {
                          f.num = -1;
                      }
                  }

                  Collections.sort(infos, (a, b) -> {
                      if (quranMode) {
                          int ca = a.quran > 0 ? 0 : 1;
                          int cb = b.quran > 0 ? 0 : 1;
                          if (ca != cb) return ca - cb;
                          if (ca == 0 && a.quran != b.quran) return a.quran < b.quran ? -1 : 1;
                      }
                      int na = a.seq != null ? 0 : 1;
                      int nb = b.seq != null ? 0 : 1;
                      if (na != nb) return na - nb;
                      if (na == 0) {
                          int cs = cmpSeq(a.seq, b.seq);
                          if (cs != 0) return cs;
                      }
                      int c = a.key.compareTo(b.key);
                      if (c != 0) return c;
                      return a.item.name.compareTo(b.item.name);
                  });

                  for (Info f : infos) res.items.add(f.item);
                  if (quranMode) res.mode = MODE_QURAN;
                  else if (anyNumber) res.mode = MODE_NUMBERS;
                  else res.mode = MODE_ALPHA;
                  return res;
              }
          }
          EOF

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::signing key missing: add the secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > app/release.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Murattib-Card-JOC.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1-${{ github.run_number }}
          name: "مُرتب كارت جوك 3.1 (${{ github.run_number }})"
          body: |
            تطبيق «مُرتب كارت جوك» من شركة هود للتكنولوجيا، الإصدار 3.1.
            إن ظهرت رسالة «التطبيق لم يُثبَّت»: افتح إعدادات الهاتف ثم التطبيقات، واسمح لتطبيق الملفات أو المتصفح الذي نزّلت منه بتثبيت التطبيقات الخارجية، ثم أعد المحاولة.
          files: Murattib-Card-JOC.apk
