              private GradientDrawable shape(int color, int stroke) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(12 * dens);
                  if (stroke != 0) g.setStroke((int) Math.max(1, dens), stroke);
