          package com.example.ordercopy;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Pattern;

          public class Sorter {

              public static final int MODE_QURAN = 0;
              public static final int MODE_NUMBERS = 1;
              public static final int MODE_ALPHA = 2;

              public static String modeName(int m) {
                  if (m == MODE_QURAN) return "ترتيب المصحف";
                  if (m == MODE_NUMBERS) return "ترتيب الأرقام";
                  return "ترتيب أبجدي";
              }

              public static class Result {
                  public List<MainActivity.Item> items = new ArrayList<>();
                  public int mode = MODE_ALPHA;
              }

              static class Info {
                  MainActivity.Item item;
                  String key;
                  List<String> toks;
                  int quran = -1;
                  long digits = -1;
                  int word = -1;
                  long num = -1;
                  List<Long> dlist = new ArrayList<>();
                  long[] seq = null;
              }

              // ================= التطبيع =================

              static String norm(String s) {
                  StringBuilder sb = new StringBuilder(s.length());
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if (c >= '\u0660' && c <= '\u0669') {
                          sb.append((char) ('0' + (c - '\u0660')));
                          continue;
                      }
                      if (c >= '\u06F0' && c <= '\u06F9') {
                          sb.append((char) ('0' + (c - '\u06F0')));
                          continue;
                      }
                      if ((c >= '\u064B' && c <= '\u065F') || c == '\u0670' || c == '\u0640' || c == '\u0621') continue;
                      switch (c) {
                          case '\u0623':
                          case '\u0625':
                          case '\u0622':
                          case '\u0671':
                              c = '\u0627';
                              break;
                          case '\u0649':
                          case '\u0626':
                              c = '\u064A';
                              break;
                          case '\u0629':
                              c = '\u0647';
                              break;
                          case '\u0624':
                              c = '\u0648';
                              break;
                          default:
                              break;
                      }
                      sb.append(Character.toLowerCase(c));
                  }
                  return sb.toString();
              }

              static boolean isDigits(String t) {
                  return t.length() > 0 && t.charAt(0) >= '0' && t.charAt(0) <= '9';
              }

              static List<String> tokens(String s) {
                  List<String> out = new ArrayList<>();
                  StringBuilder cur = new StringBuilder();
                  int kind = 0;
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      int k;
                      if (c >= '0' && c <= '9') k = 1;
                      else if (Character.isLetter(c)) k = 2;
                      else k = 0;
                      if (k == 0 || k != kind) {
                          if (cur.length() > 0) {
                              out.add(cur.toString());
                              cur.setLength(0);
                          }
                      }
                      if (k != 0) cur.append(c);
                      kind = k;
                  }
                  if (cur.length() > 0) out.add(cur.toString());
                  return out;
              }

              static String stripAl(String t) {
                  if (t.length() > 4 && t.startsWith("وال")) return "و" + t.substring(3);
                  if (t.length() > 3 && t.startsWith("ال")) return t.substring(2);
                  return t;
              }

              static List<String> prep(String normalized) {
                  List<String> raw = tokens(normalized);
                  List<String> out = new ArrayList<>();
                  for (int i = 0; i < raw.size(); i++) {
                      String t = raw.get(i);
                      if (t.equals("و") && i + 1 < raw.size() && !isDigits(raw.get(i + 1))) {
                          t = "و" + raw.get(i + 1);
                          i++;
                      }
                      out.add(stripAl(t));
                  }
                  return out;
              }

              static String join(List<String> t, int from, int to) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = from; i < to; i++) {
                      if (i > from) sb.append(' ');
                      sb.append(t.get(i));
                  }
                  return sb.toString();
              }

              static String phraseKey(String phrase) {
                  List<String> t = prep(norm(phrase));
                  return join(t, 0, t.size());
              }

              static String stripExt(String name) {
                  int d = name.lastIndexOf('.');
                  int len = name.length() - d - 1;
                  if (d > 0 && len >= 1 && len <= 5) {
                      for (int i = d + 1; i < name.length(); i++) {
                          char c = name.charAt(i);
                          boolean ok = (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9');
                          if (!ok) return name;
                      }
                      return name.substring(0, d);
                  }
                  return name;
              }

              // ================= أسماء الأرقام =================

              static final String[] ORD_M = {"", "الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر"};
              static final String[] ORD_F = {"", "الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة", "التاسعة", "العاشرة"};
              static final String[] CARD_M = {"", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة", "عشرة"};
              static final String[] CARD_F = {"", "واحدة", "اثنتان", "ثلاث", "أربع", "خمس", "ست", "سبع", "ثمان", "تسع", "عشر"};
              static final String[] TENS = {"", "", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"};
              static final String[] TENS_ACC = {"", "", "عشرين", "ثلاثين", "أربعين", "خمسين", "ستين", "سبعين", "ثمانين", "تسعين"};

              static final String[] EN_C = {"", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
                      "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"};
              static final String[] EN_O = {"", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth",
                      "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth"};
              static final String[] EN_TC = {"", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"};
              static final String[] EN_TO = {"", "", "twentieth", "thirtieth", "fortieth", "fiftieth", "sixtieth", "seventieth", "eightieth", "ninetieth"};

              static String[] unitForms(int u) {
                  switch (u) {
                      case 1:
                          return new String[]{"الحادي", "الحادية", "واحد", "واحدة"};
                      case 2:
                          return new String[]{"الثاني", "الثانية", "اثنان", "اثنين", "اثنتان", "اثنتين"};
                      case 8:
                          return new String[]{ORD_M[8], ORD_F[8], CARD_M[8], CARD_F[8], "ثماني"};
                      default:
                          return new String[]{ORD_M[u], ORD_F[u], CARD_M[u], CARD_F[u]};
                  }
              }

              static String[] hundredForms(int h) {
                  if (h == 1) return new String[]{"مئة", "مائة", "مية"};
                  if (h == 2) return new String[]{"مئتان", "مائتان", "مئتين", "مائتين", "ميتين"};
                  return new String[]{"ثلاثمئة", "ثلاثمائة", "ثلاث مئة", "ثلاث مائة", "ثلثمائة", "ثلاثمية"};
              }

              static List<String> arabicPhrases(int n) {
                  List<String> r = new ArrayList<>();
                  if (n >= 1 && n <= 9) {
                      r.add(ORD_M[n]);
                      r.add(ORD_F[n]);
                      r.add(CARD_M[n]);
                      r.add(CARD_F[n]);
                      if (n == 2) {
                          r.add("اثنين");
                          r.add("اثنتين");
                      }
                      if (n == 8) r.add("ثماني");
                  } else if (n == 10) {
                      r.add(ORD_M[10]);
                      r.add(ORD_F[10]);
                      r.add(CARD_M[10]);
                      r.add(CARD_F[10]);
                  } else if (n <= 19) {
                      int u = n - 10;
                      String om = (u == 1) ? "الحادي" : ORD_M[u];
                      String of = (u == 1) ? "الحادية" : ORD_F[u];
                      r.add(om + " عشر");
                      r.add(of + " عشرة");
                      if (u == 1) {
                          r.add("أحد عشر");
                          r.add("إحدى عشرة");
                      } else if (u == 2) {
                          r.add("اثنا عشر");
                          r.add("اثني عشر");
                          r.add("اثنتا عشرة");
                          r.add("اثنتي عشرة");
                      } else {
                          r.add(CARD_M[u] + " عشر");
                          r.add(CARD_F[u] + " عشرة");
                          if (u == 8) r.add("ثماني عشرة");
                      }
                  } else if (n <= 99) {
                      int t = n / 10;
                      int u = n % 10;
                      if (u == 0) {
                          r.add(TENS[t]);
                          r.add(TENS_ACC[t]);
                      } else {
                          for (String f : unitForms(u)) {
                              r.add(f + " و" + TENS[t]);
                              r.add(f + " و" + TENS_ACC[t]);
                          }
                      }
                  } else {
                      int h = n / 100;
                      int rem = n % 100;
                      for (String f : hundredForms(h)) {
                          if (rem == 0) {
                              r.add(f);
                          } else {
                              for (String p : arabicPhrases(rem)) r.add(f + " و" + p);
                          }
                      }
                  }
                  return r;
              }

              static List<String> englishPhrases(int n) {
                  List<String> r = new ArrayList<>();
                  if (n < 20) {
                      r.add(EN_C[n]);
                      r.add(EN_O[n]);
                  } else if (n < 100) {
                      int t = n / 10;
                      int u = n % 10;
                      if (u == 0) {
                          r.add(EN_TC[t]);
                          r.add(EN_TO[t]);
                      } else {
                          r.add(EN_TC[t] + " " + EN_C[u]);
                          r.add(EN_TC[t] + " " + EN_O[u]);
                      }
                  } else {
                      int h = n / 100;
                      int rem = n % 100;
                      String[] pf = (h == 1) ? new String[]{"hundred", "one hundred"} : new String[]{EN_C[h] + " hundred"};
                      for (String f : pf) {
                          if (rem == 0) {
                              r.add(f);
                              r.add(f + "th");
                          } else {
                              for (String p : englishPhrases(rem)) {
                                  r.add(f + " " + p);
                                  r.add(f + " and " + p);
                              }
                          }
                      }
                  }
                  return r;
              }

              static final Map<String, Integer> WORDS = new HashMap<>();

              static void putWord(String phrase, int n) {
                  String k = phraseKey(phrase);
                  if (!WORDS.containsKey(k)) WORDS.put(k, n);
              }

              static {
                  for (int n = 1; n <= 300; n++) {
                      for (String p : arabicPhrases(n)) putWord(p, n);
                      for (String p : englishPhrases(n)) putWord(p, n);
                  }
              }

              static int wordNumber(List<String> toks) {
                  int n = toks.size();
                  for (int i = 0; i < n; i++) {
                      int maxLen = Math.min(6, n - i);
                      for (int len = maxLen; len >= 1; len--) {
                          Integer v = WORDS.get(join(toks, i, i + len));
                          if (v != null) return v;
                      }
                  }
                  return -1;
              }

              // وسوم فنية لا تدل على الترتيب (MP3 و70K و128kbps وما شابه) تُحذف قبل قراءة الأرقام
              static final Pattern TECH = Pattern.compile(
                      "(?<![\\p{L}\\p{N}])(?:mp[234]|m4[ab]|wav|wma|aac|flac|ogg|opus|amr|aiff?"
                              + "|\\d{1,4}(?:\\.\\d+)?\\s?(?:kbps|kbit|kbs|khz|hz|mb|kb|k))(?![\\p{L}\\p{N}])");

              static String stripTech(String s) {
                  return TECH.matcher(s).replaceAll(" ");
              }

              static List<Long> digitNumbers(List<String> toks) {
                  List<Long> out = new ArrayList<>();
                  for (String t : toks) {
                      if (isDigits(t)) {
                          String d = t.length() > 15 ? t.substring(0, 15) : t;
                          out.add(Long.parseLong(d));
                      }
                  }
                  return out;
              }

              static int cmpSeq(long[] a, long[] b) {
                  int n = Math.min(a.length, b.length);
                  for (int i = 0; i < n; i++) {
                      if (a[i] != b[i]) return a[i] < b[i] ? -1 : 1;
                  }
                  return a.length - b.length;
              }

              static long digitNumber(List<String> toks) {
                  for (String t : toks) {
                      if (isDigits(t)) {
                          String d = t.length() > 15 ? t.substring(0, 15) : t;
                          return Long.parseLong(d);
                      }
                  }
                  return -1;
              }

              // ================= المصحف =================

              static final String[][] SURAHS = {
                      {"الفاتحة", "فاتحة الكتاب"},
                      {"البقرة"},
                      {"آل عمران", "عمران"},
